name: komorebi_coffee
description: "KOMOREBI COFFEE - official app for a fictional café chain (portfolio project)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Platform / storage
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0

  # UI
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  barcode_widget: ^2.0.4

  # Utilities
  intl: any
  uuid: ^4.5.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/mock/

  fonts:
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
